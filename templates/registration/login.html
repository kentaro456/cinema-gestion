{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h1 class="h4 mb-3 text-center">Connexion</h1>

          {% if form.errors %}
            <div class="alert alert-danger" role="alert">
              Identifiant ou mot de passe incorrect.
            </div>
          {% endif %}

          <form method="post" action="{% url 'login' %}" novalidate>
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

            <div class="mb-3">
              <label for="{{ form.username.id_for_label }}" class="form-label">Identifiant</label>
              <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                     class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
              <label for="{{ form.password.id_for_label }}" class="form-label">Mot de passe</label>
              <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                     class="form-control" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
